<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Listing</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Our Grade</h1>

    <div class="card shadow">
        <div class="card-body">
            <a href="{% url 'grade-create' %}"> <button class="btn btn-primary btn-sm"> Create </button></a>

            <div class="table-responsive">
                <table class="table table-bordered table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>SN</th>
                            <th>Name</th>
                            <th>Class Teacher</th>
                            <th>Subject</th>
                            <th>Action</th>
                        </tr>
                    </thead>
{{grade}}
                    <tbody>
                        {% for i in grade %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ i.name }}</td>
                            <td>{{ i.class_teacher.full_name }}</td>

                            <td>
                                {% for j in i.subject.all %}
                                <button class="btn btn-danger"> {{j.short_name}} </button>
                               {% endfor %}
                            </td>

                            <td>
                                  
                                   <a href=""> <button class="btn btn-primary btn-sm"> Update </button></a>
                                    <a href=""> <button class="btn btn-danger btn-sm"> Delete </button></a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                No student found.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
